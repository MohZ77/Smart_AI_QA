[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huixiaoan-rag"
version = "0.1.0"
description = "小智财答：面向金融理财场景的企业级 RAG 问答平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "jieba>=0.42",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "redis>=5.0",
  "pymysql>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=2.7",
  "pymilvus>=2.4",
  "ragas>=0.1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
