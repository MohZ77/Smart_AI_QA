<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小智财答 | 智能金融知识助手</title>
  <style>
    :root {
      --bg: #f1f3f6;
      --panel: #ffffff;
      --sidebar: #f7f8fa;
      --ink: #1d2738;
      --muted: #7d8799;
      --line: #e2e6ed;
      --brand: #1f4e79;
      --brand-2: #2d67a5;
      --soft: #eef4fb;
      --green: #2b9b72;
      --shadow: 0 4px 18px rgba(30, 48, 78, .06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden; color: var(--ink); background: var(--bg);
      font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 左侧品牌与历史会话 */
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 286px; height: 100vh;
      display: flex; flex-direction: column; padding: 22px 0 14px;
      background: var(--sidebar); border-right: 1px solid var(--line); z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 20px 18px; flex: 0 0 auto; }
    .logo {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      color: white; font-weight: 800; font-size: 15px;
      background: linear-gradient(135deg, #e2b55c, #d88a3b);
    }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: .02em; }
    .brand p { margin: 3px 0 0; color: #9aa4b5; font-size: 9px; letter-spacing: .12em; }
    .sidebar-actions {
      display: grid; grid-template-columns: 1fr auto; gap: 7px; padding: 0 14px 18px;
      flex: 0 0 auto;
    }
    .new-chat, .clear-chat {
      border-radius: 7px; padding: 9px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    .new-chat {
      border: 0; color: white; text-align: left;
      background: linear-gradient(135deg, #1f4e79, #2d67a5);
    }
    .new-chat:disabled, .clear-chat:disabled { opacity: .5; cursor: not-allowed; }
    .clear-chat { border: 1px solid var(--line); color: #657187; background: #fff; }
    .history-label { padding: 0 20px 8px; color: #7d8799; font-size: 11px; flex: 0 0 auto; }
    .history {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 12px;
    }
    .history-day { color: #9aa4b5; font-size: 10px; margin: 13px 8px 5px; }
    .history-empty {
      color: #9aa4b5; font-size: 11px; line-height: 1.8; padding: 18px 10px;
      text-align: center; white-space: pre-line;
    }
    .history-item {
      width: 100%; border: 1px solid transparent; background: transparent;
      border-radius: 7px; padding: 9px 9px; text-align: left; cursor: pointer;
      color: #46546a; font: inherit; font-size: 12px; line-height: 1.45;
    }
    .history-item:hover { background: #edf1f6; }
    .history-item.active { background: #e8eef7; border-color: #d5dfec; color: #1f4e79; }
    .history-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-meta { color: #9aa4b5; font-size: 10px; margin-top: 3px; }
    .sidebar-foot { padding: 10px 20px 0; color: #9aa4b5; font-size: 10px; flex: 0 0 auto; }

    /* 中间工作区 */
    .workspace {
      margin-left: 286px; height: 100vh; display: flex; flex-direction: column;
      padding: 22px 28px 12px; min-width: 0; transition: margin-right .2s ease;
    }
    .workspace-header {
      flex: 0 0 auto; max-width: 830px; width: 100%; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 18px;
    }
    .workspace-header h2 { margin: 0; font-size: 24px; letter-spacing: -.03em; }
    .workspace-header p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .header-right { display: flex; align-items: center; gap: 9px; }
    .online {
      display: inline-flex; align-items: center; gap: 5px; color: #2b9b72;
      font-size: 11px; padding: 4px 8px; background: #eaf8f1; border-radius: 999px;
    }
    .online::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
    .account-name {
      max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: #34445f; font-size: 11px; padding: 4px 2px;
    }
    .account-btn {
      border: 1px solid var(--line); background: #fff; color: #53627a;
      border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 11px; cursor: pointer;
    }
    .account-btn:hover { border-color: #b8cbe1; color: var(--brand); }
    select {
      font: inherit; font-size: 11px; color: #53627a; background: white;
      border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none;
    }
    .chat {
      width: 100%; max-width: 830px; margin: 14px auto 0; flex: 1 1 auto; min-height: 0;
      overflow-y: auto; padding: 4px 2px 24px;
    }
    .welcome { margin: 9vh auto 0; max-width: 560px; text-align: center; }
    .welcome-icon {
      width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
      display: grid; place-items: center; color: white; font-size: 20px;
      background: linear-gradient(135deg, #1f4e79, #2d67a5);
      box-shadow: 0 8px 22px rgba(31, 78, 121, .18);
    }
    .welcome h3 { margin: 0; font-size: 20px; }
    .welcome p { margin: 9px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.8; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 20px; }
    .suggestions .example {
      border: 1px solid var(--line); background: #fff; color: #53627a;
      border-radius: 999px; padding: 7px 11px; cursor: pointer; font-size: 11.5px;
    }
    .suggestions .example:hover { border-color: #b8cbe1; color: var(--brand); }

    .message { margin: 18px 0; display: flex; flex-direction: column; }
    .message.user { align-items: flex-end; }
    .message.bot { align-items: flex-start; }
    .answer-label { color: #9aa4b5; font-size: 10.5px; margin: 0 0 5px 2px; }
    .bubble {
      max-width: min(760px, 92%); padding: 12px 15px; border-radius: 8px;
      line-height: 1.8; font-size: 13.5px; white-space: pre-wrap; word-break: break-word;
    }
    .bot .bubble { background: #fff; border: 1px solid #e3e7ee; box-shadow: var(--shadow); }
    .user .bubble { background: #2d4d78; color: #fff; border-radius: 8px 2px 8px 8px; }
    .bubble figure { margin: 12px 0 3px; }
    .bubble img { display: block; max-width: 100%; max-height: 360px; object-fit: contain; border-radius: 6px; }
    .bubble figcaption { margin-top: 4px; color: var(--muted); font-size: 10.5px; }
    .answer-actions { display: flex; align-items: center; gap: 7px; margin-top: 8px; padding-left: 2px; }
    .action-chip {
      border: 1px solid #dfe5ee; background: #f7f9fc; color: #5c6c84;
      border-radius: 6px; padding: 4px 8px; font-size: 10.5px; cursor: pointer;
    }
    .action-chip:hover { border-color: #b9cee5; color: var(--brand); }
    .answer-note { color: #9a6b1a; font-size: 10.5px; margin-top: 6px; padding-left: 2px; }
    .feedback-ok { color: var(--green); }

    /* 输入区 */
    .composer-area { flex: 0 0 auto; max-width: 830px; width: 100%; margin: 0 auto; }
    .previews { display: flex; gap: 8px; margin-bottom: 7px; }
    .preview {
      display: flex; align-items: center; gap: 8px; background: white; border: 1px solid var(--line);
      border-radius: 7px; padding: 6px 8px; font-size: 11px; color: #5c6c84;
    }
    .preview[hidden] { display: none; }
    .preview img { width: 42px; height: 32px; object-fit: cover; border-radius: 4px; }
    .preview button { border: 0; background: transparent; color: #b42318; cursor: pointer; font-size: 13px; }
    .composer {
      background: #fff; border: 1px solid #dce2eb; border-radius: 10px;
      box-shadow: 0 4px 14px rgba(33, 55, 90, .05); overflow: hidden;
    }
    .composer:focus-within { border-color: #a9c3df; box-shadow: 0 4px 20px rgba(31, 78, 121, .1); }
    .composer-top {
      display: flex; align-items: center; gap: 6px; padding: 7px 10px 0;
      color: #8b96a8; font-size: 10.5px;
    }
    .composer-top select { padding: 2px 4px; border: 0; background: transparent; color: #53627a; }
    .composer-main { display: grid; grid-template-columns: auto auto 1fr auto; align-items: end; gap: 5px; padding: 2px 7px 7px; }
    textarea {
      border: 0; outline: none; resize: none; background: transparent; color: var(--ink);
      font: inherit; line-height: 1.6; min-height: 44px; max-height: 130px; padding: 10px 6px;
    }
    .icon-btn {
      width: 34px; height: 34px; border: 0; border-radius: 6px; cursor: pointer;
      background: #f4f7fb; color: #5c6c84; font-size: 15px;
    }
    .icon-btn.document { width: auto; padding: 0 7px; font-size: 10.5px; }
    .icon-btn:hover { background: var(--soft); color: var(--brand); }
    .send {
      width: 36px; height: 36px; border: 0; border-radius: 7px; cursor: pointer;
      color: white; background: #2d4d78; font-size: 17px;
    }
    .send:disabled { opacity: .45; cursor: wait; }
    .composer-foot { color: #9aa4b5; font-size: 10px; padding: 7px 2px 1px; display: flex; justify-content: space-between; }

    /* 右侧引用来源抽屉 */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(22, 33, 51, .22);
      opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .source-drawer {
      position: fixed; top: 0; right: 0; width: 330px; height: 100vh; z-index: 21;
      background: #f8f9fb; border-left: 1px solid var(--line);
      transform: translateX(100%); transition: transform .22s ease;
      display: flex; flex-direction: column;
    }
    .source-drawer.open { transform: translateX(0); }
    .drawer-head {
      height: 58px; flex: 0 0 auto; padding: 0 17px; display: flex; align-items: center;
      justify-content: space-between; background: #fff; border-bottom: 1px solid var(--line);
    }
    .drawer-head h2 { margin: 0; font-size: 15px; }
    .drawer-close { border: 0; background: transparent; font-size: 20px; color: #657187; cursor: pointer; }
    .source-list { overflow-y: auto; padding: 12px; display: grid; gap: 9px; }
    .source-card { background: #fff; border: 1px solid #e3e7ee; border-radius: 7px; padding: 11px 12px; }
    .source-card h3 { margin: 0 0 5px; font-size: 12px; color: #34445f; line-height: 1.5; }
    .source-card .source-meta { color: #8b96a8; font-size: 10px; line-height: 1.5; }
    .source-card .source-quote { color: #617089; font-size: 11px; line-height: 1.65; margin-top: 7px; }
    .source-card a { display: inline-block; margin-top: 6px; color: var(--brand-2); font-size: 10.5px; text-decoration: none; }

    /* 登录 / 注册 */
    .auth-overlay {
      position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
      padding: 20px; background: rgba(17, 27, 43, .46); backdrop-filter: blur(3px);
    }
    .auth-overlay[hidden] { display: none; }
    .auth-card {
      width: min(390px, 100%); background: #fff; border-radius: 14px;
      padding: 24px; box-shadow: 0 24px 70px rgba(18, 31, 52, .24);
    }
    .auth-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .auth-head .logo { width: 38px; height: 38px; }
    .auth-head h3 { margin: 0; font-size: 18px; }
    .auth-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: #f3f6fa; border-radius: 8px; margin-bottom: 16px; }
    .auth-tab {
      border: 0; background: transparent; border-radius: 6px; padding: 8px;
      color: #718096; font: inherit; font-size: 12px; cursor: pointer;
    }
    .auth-tab.active { background: #fff; color: var(--brand); box-shadow: 0 1px 4px rgba(30, 48, 78, .1); }
    .auth-card label { display: block; margin: 0 0 12px; color: #53627a; font-size: 11.5px; }
    .auth-card input {
      display: block; width: 100%; margin-top: 5px; padding: 10px 11px;
      border: 1px solid #dce2eb; border-radius: 7px; font: inherit; font-size: 13px; outline: none;
    }
    .auth-card input:focus { border-color: #a9c3df; box-shadow: 0 0 0 3px rgba(45, 103, 165, .08); }
    .auth-error { min-height: 18px; color: #b42318; font-size: 11px; line-height: 1.5; margin-bottom: 8px; }
    .auth-submit {
      width: 100%; border: 0; border-radius: 7px; padding: 11px;
      color: #fff; background: linear-gradient(135deg, #1f4e79, #2d67a5);
      font: inherit; font-size: 13px; cursor: pointer;
    }
    .auth-submit:disabled { opacity: .55; cursor: wait; }
    .auth-skip {
      width: 100%; border: 0; background: transparent; color: #7d8799;
      padding: 11px 0 2px; font: inherit; font-size: 11.5px; cursor: pointer;
    }
    .auth-skip:hover { color: var(--brand); }
    .auth-tip { margin: 8px 0 0; color: #9aa4b5; font-size: 10px; line-height: 1.6; text-align: center; }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .workspace { margin-left: 0; padding: 16px 12px 10px; }
      .chat { max-width: none; }
      .composer-area { max-width: none; }
      .source-drawer { width: min(330px, 88vw); }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">智</div>
      <div><h1>小智财答</h1><p>FINANCIAL RAG WORKBENCH</p></div>
    </div>
    <div class="sidebar-actions">
      <button class="new-chat" id="new-chat" type="button">＋ 新会话</button>
      <button class="clear-chat" id="clear-chat" type="button">清空当前</button>
    </div>
    <div class="history-label">历史会话</div>
    <div class="history" id="history"></div>
    <div class="sidebar-foot">会话 ID：<span id="session-label">—</span></div>
  </aside>

  <main class="workspace">
    <div class="workspace-header">
      <div>
        <h2>智能问答</h2>
        <p>产品解读 · 市场分析 · 资产配置 · 合同审查</p>
      </div>
      <div class="header-right">
        <span class="online">在线</span>
        <span class="account-name" id="account-name" hidden></span>
        <button class="account-btn" id="account-btn" type="button">登录 / 注册</button>
        <button class="account-btn" id="logout-btn" type="button" hidden>退出</button>
        <label class="risk">风险偏好
          <select id="risk">
            <option value="C1">保守型 C1</option>
            <option value="C2">稳健型 C2</option>
            <option value="C3" selected>平衡型 C3</option>
            <option value="C4">成长型 C4</option>
            <option value="C5">进取型 C5</option>
          </select>
        </label>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">智</div>
        <h3>今天想了解什么？</h3>
        <p>输入产品名称、条款问题或市场问题，我会结合知识库给出可追溯的回答。</p>
        <div class="suggestions">
          <button class="example" type="button">R4 产品适合什么投资者？</button>
          <button class="example" type="button">基金怎么买？</button>
          <button class="example" type="button">解读一份保险条款</button>
        </div>
      </div>
    </div>

    <div class="composer-area">
      <div class="previews">
        <div class="preview" id="image-preview" hidden>
          <img id="image-preview-img" alt="待发送图片" />
          <span id="image-preview-name"></span>
          <button type="button" id="image-remove">×</button>
        </div>
        <div class="preview" id="document-preview" hidden>
          <span>文件</span><span id="document-preview-name"></span>
          <button type="button" id="document-remove">×</button>
        </div>
      </div>
      <form class="composer" id="form">
        <div class="composer-top">知识域：
          <select id="domain">
            <option value="all">全部</option>
            <option value="fund">基金</option>
            <option value="insurance">保险</option>
            <option value="bank_wealth">银行理财</option>
          </select>
        </div>
        <input type="file" id="image-input" accept="image/*" hidden />
        <input type="file" id="document-input" accept=".pdf,.docx,.md,.markdown,.txt,.html,.htm" hidden />
        <div class="composer-main">
          <button class="icon-btn" id="attach" type="button" title="上传图片" aria-label="上传图片">图</button>
          <button class="icon-btn document" id="document-attach" type="button" title="上传合同/条款">文件</button>
          <textarea id="question" placeholder="输入问题，Enter 发送" rows="1"></textarea>
          <button class="send" id="send" type="submit" aria-label="发送">↑</button>
        </div>
      </form>
      <div class="composer-foot"><span>内容仅供参考，不构成投资建议</span><span>Enter 发送 · Shift + Enter 换行</span></div>
    </div>
  </main>

  <div class="auth-overlay" id="auth-overlay" hidden>
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="auth-head">
        <div class="logo">智</div>
        <div><h3 id="auth-title">登录小智财答</h3><p>登录后保存风险画像、会话记录与审计来源</p></div>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="auth-tab-login" type="button">登录</button>
        <button class="auth-tab" id="auth-tab-register" type="button">注册</button>
      </div>
      <form id="auth-form">
        <label>用户名
          <input id="auth-username" autocomplete="username" maxlength="32" placeholder="3-32 位中文、字母或数字" required />
        </label>
        <label id="auth-display-row" hidden>显示名称
          <input id="auth-display" autocomplete="nickname" maxlength="64" placeholder="选填" />
        </label>
        <label>密码
          <input id="auth-password" type="password" autocomplete="current-password" maxlength="128" placeholder="至少 8 位，包含字母和数字" required />
        </label>
        <div class="auth-error" id="auth-error" role="alert"></div>
        <button class="auth-submit" id="auth-submit" type="submit">登录</button>
      </form>
      <button class="auth-skip" id="auth-skip" type="button">暂不登录，先体验</button>
      <p class="auth-tip">密码经加盐哈希存储；登录身份用于风险画像和会话隔离。</p>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="source-drawer" id="source-drawer">
    <div class="drawer-head"><h2>引用来源</h2><button class="drawer-close" id="drawer-close" type="button">×</button></div>
    <div class="source-list" id="source-list"></div>
  </aside>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const send = document.getElementById("send");
    const risk = document.getElementById("risk");
    const domain = document.getElementById("domain");
    const welcome = document.getElementById("welcome");
    const attach = document.getElementById("attach");
    const imageInput = document.getElementById("image-input");
    const imagePreview = document.getElementById("image-preview");
    const imagePreviewImg = document.getElementById("image-preview-img");
    const imagePreviewName = document.getElementById("image-preview-name");
    const imageRemove = document.getElementById("image-remove");
    const documentAttach = document.getElementById("document-attach");
    const documentInput = document.getElementById("document-input");
    const documentPreview = document.getElementById("document-preview");
    const documentPreviewName = document.getElementById("document-preview-name");
    const documentRemove = document.getElementById("document-remove");
    const newChat = document.getElementById("new-chat");
    const clearChat = document.getElementById("clear-chat");
    const historyEl = document.getElementById("history");
    const sessionLabel = document.getElementById("session-label");
    const drawer = document.getElementById("source-drawer");
    const backdrop = document.getElementById("drawer-backdrop");
    const sourceList = document.getElementById("source-list");
    const drawerClose = document.getElementById("drawer-close");
    const accountName = document.getElementById("account-name");
    const accountBtn = document.getElementById("account-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const authOverlay = document.getElementById("auth-overlay");
    const authForm = document.getElementById("auth-form");
    const authUsername = document.getElementById("auth-username");
    const authPassword = document.getElementById("auth-password");
    const authDisplay = document.getElementById("auth-display");
    const authDisplayRow = document.getElementById("auth-display-row");
    const authError = document.getElementById("auth-error");
    const authSubmit = document.getElementById("auth-submit");
    const authTabLogin = document.getElementById("auth-tab-login");
    const authTabRegister = document.getElementById("auth-tab-register");
    const authSkip = document.getElementById("auth-skip");

    const authStorageKey = "xiaozhi_token_v1";
    let authToken = localStorage.getItem(authStorageKey) || "";
    let currentUser = null;
    let authMode = "login";
    let sessions = loadSessions();
    let draft = null;
    let sessionId = "";
    let currentMessages = [];
    let currentSources = [];
    let busy = false;
    let selectedImage = null;
    let selectedDocument = null;
    let lastSubmit = { key: "", at: 0 };

    function newId() {
      return "session-" + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Date.now());
    }

    function hasRounds(item) {
      return !!item && Array.isArray(item.messages) && item.messages.length > 0;
    }

    function sessionStorageKey() {
      return "xiaozhi_sessions_v1:" + (currentUser ? currentUser.id : "anon");
    }

    function loadSessions() {
      try {
        let stored = localStorage.getItem(sessionStorageKey());
        if (!stored && !currentUser) {
          // 兼容旧版本的匿名会话存储键
          stored = localStorage.getItem("xiaozhi_sessions_v1");
          if (stored) localStorage.setItem(sessionStorageKey(), stored);
        }
        const raw = JSON.parse(stored || "[]");
        if (!Array.isArray(raw)) return [];
        const clean = raw.filter(hasRounds);
        if (clean.length !== raw.length) {
          localStorage.setItem(sessionStorageKey(), JSON.stringify(clean));
        }
        return clean;
      } catch (_) {
        return [];
      }
    }

    function persistSessions() {
      try {
        const clean = sessions.filter(hasRounds).slice(0, 30);
        localStorage.setItem(sessionStorageKey(), JSON.stringify(clean));
      } catch (_) {}
    }

    function authHeaders(extra = {}) {
      const headers = { ...extra };
      if (authToken) headers.Authorization = "Bearer " + authToken;
      return headers;
    }

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: authHeaders(options.headers || {})
      });
      if (response.status === 401 && authToken) clearAuth(true);
      return response;
    }

    function profilePayload() {
      if (currentUser) {
        return { user_id: currentUser.id, risk_level: currentUser.risk_level || risk.value };
      }
      return { user_id: "web", risk_level: risk.value };
    }

    function detailText(payload) {
      const detail = payload && payload.detail;
      if (Array.isArray(detail)) {
        return detail.map((item) => item.msg || String(item)).join("；");
      }
      return detail || "请求失败，请稍后重试";
    }

    function applyAccountUI() {
      if (currentUser) {
        accountName.textContent = currentUser.display_name || currentUser.username;
        accountName.hidden = false;
        accountBtn.hidden = true;
        logoutBtn.hidden = false;
        if (currentUser.risk_level) risk.value = currentUser.risk_level;
      } else {
        accountName.hidden = true;
        accountBtn.hidden = false;
        logoutBtn.hidden = true;
      }
    }

    function setAuthMode(mode) {
      authMode = mode === "register" ? "register" : "login";
      const registering = authMode === "register";
      authTabLogin.classList.toggle("active", !registering);
      authTabRegister.classList.toggle("active", registering);
      authDisplayRow.hidden = !registering;
      authSubmit.textContent = registering ? "注册并登录" : "登录";
      authPassword.autocomplete = registering ? "new-password" : "current-password";
      authError.textContent = "";
    }

    function showAuth(mode = "login") {
      setAuthMode(mode);
      authOverlay.hidden = false;
      setTimeout(() => authUsername.focus(), 30);
    }

    function hideAuth() {
      authOverlay.hidden = true;
      authPassword.value = "";
      authError.textContent = "";
    }

    function switchSessionScope() {
      sessions = loadSessions();
      draft = null;
      sessionId = "";
      currentMessages = [];
      const latest = [...sessions].sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (latest) loadSession(latest);
      else startNewSession();
    }

    function clearAuth(showLogin = true) {
      authToken = "";
      currentUser = null;
      try { localStorage.removeItem(authStorageKey); } catch (_) {}
      applyAccountUI();
      switchSessionScope();
      if (showLogin) showAuth("login");
    }

    async function submitAuth(event) {
      event.preventDefault();
      const username = authUsername.value.trim();
      const password = authPassword.value;
      if (!username || !password) {
        authError.textContent = "请输入用户名和密码";
        return;
      }
      authSubmit.disabled = true;
      authError.textContent = "";
      try {
        const body = { username, password };
        if (authMode === "register") body.display_name = authDisplay.value.trim();
        const response = await fetch("/v1/auth/" + authMode, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(detailText(payload));
        authToken = payload.access_token;
        currentUser = payload.user;
        try { localStorage.setItem(authStorageKey, authToken); } catch (_) {}
        hideAuth();
        applyAccountUI();
        switchSessionScope();
      } catch (error) {
        authError.textContent = error.message || "登录失败";
      } finally {
        authSubmit.disabled = false;
      }
    }

    async function bootstrapAuth() {
      let restored = false;
      if (authToken) {
        try {
          const response = await fetch("/v1/auth/me", { headers: authHeaders() });
          if (!response.ok) throw new Error("expired");
          currentUser = (await response.json()).user;
          applyAccountUI();
          switchSessionScope();
          restored = true;
        } catch (_) {
          authToken = "";
          currentUser = null;
          try { localStorage.removeItem(authStorageKey); } catch (_) {}
        }
      }
      applyAccountUI();
      if (!restored) {
        const latest = [...sessions].sort((a, b) => b.updatedAt - a.updatedAt)[0];
        if (latest) loadSession(latest);
        else startNewSession();
      }
      if (!currentUser) showAuth("login");
    }

    function currentSession() {
      if (draft && sessionId === draft.id) return draft;
      return sessions.find((item) => item.id === sessionId);
    }

    function ensureSession() {
      let item = currentSession();
      if (!item) {
        if (!draft) {
          draft = { id: newId(), title: "新会话", updatedAt: Date.now(), messages: [] };
        }
        sessionId = draft.id;
        item = draft;
      }
      sessionLabel.textContent = item.id;
      return item;
    }

    function startNewSession() {
      if (busy) return;
      const current = currentSession();
      if (current && !hasRounds(current)) {
        sessionLabel.textContent = current.id;
        resetChat();
        input.focus();
        return;
      }
      draft = { id: newId(), title: "新会话", updatedAt: Date.now(), messages: [] };
      sessionId = draft.id;
      currentMessages = [];
      sessionLabel.textContent = sessionId;
      renderHistory();
      resetChat();
      input.focus();
    }

    function saveCurrent() {
      if (!currentMessages.length) return;
      const item = ensureSession();
      const firstUser = currentMessages.find((message) => message.role === "user");
      item.messages = currentMessages.slice(-80);
      item.updatedAt = Date.now();
      if (!item.title || item.title === "新会话") {
        item.title = ((firstUser && firstUser.text) || "新会话").slice(0, 26) || "新会话";
      }
      const existing = sessions.find((session) => session.id === item.id);
      if (existing) {
        existing.messages = item.messages;
        existing.updatedAt = item.updatedAt;
        existing.title = item.title;
      } else {
        sessions.unshift(item);
      }
      if (draft && draft.id === item.id) draft = null;
      persistSessions();
      renderHistory();
    }

    function renderHistory() {
      const sorted = sessions.filter(hasRounds).sort((a, b) => b.updatedAt - a.updatedAt);
      historyEl.replaceChildren();
      const current = currentSession();
      const emptyDraft = !!current && !hasRounds(current);
      newChat.disabled = emptyDraft;
      newChat.title = emptyDraft
        ? "当前已是新会话，发送第一条问题后才会保存"
        : "开始新会话";
      clearChat.disabled = emptyDraft;
      if (!sorted.length) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = "暂无历史会话\n发送第一条问题后会自动保存";
        historyEl.appendChild(empty);
        return;
      }
      let lastLabel = "";
      sorted.forEach((item) => {
        const label = dayLabel(item.updatedAt);
        if (label !== lastLabel) {
          const day = document.createElement("div");
          day.className = "history-day";
          day.textContent = label;
          historyEl.appendChild(day);
          lastLabel = label;
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item" + (item.id === sessionId ? " active" : "");
        const title = document.createElement("div");
        title.className = "history-title";
        title.textContent = item.title || "新会话";
        const meta = document.createElement("div");
        meta.className = "history-meta";
        const rounds = Math.ceil((item.messages?.length || 0) / 2);
        meta.textContent = `${rounds} 轮 · ${timeLabel(item.updatedAt)}`;
        button.append(title, meta);
        button.addEventListener("click", () => loadSession(item));
        historyEl.appendChild(button);
      });
    }

    function dayLabel(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      if (timestamp >= start) return "今天";
      if (timestamp >= start - 86400000) return "昨天";
      return `${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function timeLabel(timestamp) {
      return new Date(timestamp).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    function resetChat() {
      chat.replaceChildren();
      const node = document.createElement("div");
      node.className = "welcome";
      node.id = "welcome";
      node.innerHTML = '<div class="welcome-icon">智</div><h3>今天想了解什么？</h3>' +
        '<p>输入产品名称、条款问题或市场问题，我会结合知识库给出可追溯的回答。</p>' +
        '<div class="suggestions">' +
        '<button class="example" type="button">R4 产品适合什么投资者？</button>' +
        '<button class="example" type="button">基金怎么买？</button>' +
        '<button class="example" type="button">解读一份保险条款</button></div>';
      chat.appendChild(node);
      bindExamples(node);
    }

    function loadSession(item) {
      if (busy) return;
      if (!hasRounds(item)) {
        startNewSession();
        return;
      }
      draft = null;
      sessionId = item.id;
      currentMessages = (item.messages || []).map((message) => ({ ...message }));
      chat.replaceChildren();
      sessionLabel.textContent = item.id;
      currentMessages.forEach((message) => {
        const rendered = addMessage(message.role, message.text, {
          citations: message.citations,
          strategy: message.strategy,
          requestId: message.requestId,
          noStore: true
        });
        if (message.role === "assistant") {
          renderActions(rendered.message, { ...message, request_id: message.requestId });
        }
      });
      if (!currentMessages.length) resetChat();
      renderHistory();
    }

    function bindExamples(root = document) {
      root.querySelectorAll(".example").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.textContent.trim();
          input.focus();
        });
      });
    }

    function clearImage() {
      selectedImage = null;
      imageInput.value = "";
      imagePreview.hidden = true;
      imagePreviewImg.removeAttribute("src");
      imagePreviewName.textContent = "";
    }

    function clearDocument() {
      selectedDocument = null;
      documentInput.value = "";
      documentPreview.hidden = true;
      documentPreviewName.textContent = "";
    }

    function addMessage(role, text, options = {}) {
      const existingWelcome = document.getElementById("welcome");
      if (existingWelcome) existingWelcome.remove();
      const message = document.createElement("div");
      message.className = "message " + role;
      if (role === "bot") {
        const label = document.createElement("div");
        label.className = "answer-label";
        label.textContent = "小结";
        message.appendChild(label);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      message.appendChild(bubble);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
      if (!options.noStore) {
        currentMessages.push({
          role,
          text,
          citations: options.citations || [],
          strategy: options.strategy || "",
          requestId: options.requestId || ""
        });
        if (role === "user") saveCurrent();
      }
      return { message, bubble };
    }

    function renderAnswer(bubble, text) {
      bubble.replaceChildren();
      const pattern = /!\[([^\]]*)\]\\?\(([^)\s]+)\\?\)/g;
      let last = 0;
      let match;
      while ((match = pattern.exec(text))) {
        if (match.index > last) bubble.appendChild(document.createTextNode(text.slice(last, match.index)));
        const alt = match[1] || "图片";
        const url = match[2];
        if (url.startsWith("/v1/images/") || /^https?:\/\//.test(url)) {
          const img = document.createElement("img");
          img.src = url;
          img.alt = alt;
          img.loading = "lazy";
          bubble.appendChild(img);
        } else {
          bubble.appendChild(document.createTextNode(match[0]));
        }
        last = match.index + match[0].length;
      }
      if (last < text.length) bubble.appendChild(document.createTextNode(text.slice(last)));
      chat.scrollTop = chat.scrollHeight;
    }

    function renderActions(container, payload) {
      const actions = document.createElement("div");
      actions.className = "answer-actions";
      const citations = payload.citations || [];
      const sourceButton = document.createElement("button");
      sourceButton.type = "button";
      sourceButton.className = "action-chip";
      sourceButton.textContent = citations.length ? `引用 ${citations.length} 条 · 查看来源` : "查看依据";
      sourceButton.addEventListener("click", () => showSources(citations));
      actions.appendChild(sourceButton);
      const up = document.createElement("button");
      up.type = "button";
      up.className = "action-chip";
      up.textContent = "有用";
      up.addEventListener("click", () => feedback(payload.request_id, true, up));
      const down = document.createElement("button");
      down.type = "button";
      down.className = "action-chip";
      down.textContent = "没用";
      down.addEventListener("click", () => feedback(payload.request_id, false, down));
      actions.append(up, down);
      container.appendChild(actions);
      if (payload.strategy === "llm_fallback") {
        const note = document.createElement("div");
        note.className = "answer-note";
        note.textContent = "知识库未命中，以上为通用分析，不是条款原文。";
        container.appendChild(note);
      }
    }

    function showSources(citations) {
      currentSources = citations || [];
      sourceList.replaceChildren();
      if (!currentSources.length) {
        const empty = document.createElement("div");
        empty.className = "source-card";
        empty.textContent = "本次回答没有可展示的知识库来源。";
        sourceList.appendChild(empty);
      }
      currentSources.forEach((citation) => {
        const card = document.createElement("div");
        card.className = "source-card";
        const title = document.createElement("h3");
        title.textContent = `[${citation.index}] ${citation.title || "未命名来源"}`;
        const meta = document.createElement("div");
        meta.className = "source-meta";
        meta.textContent = [
          citation.section,
          citation.article,
          citation.page ? `第 ${citation.page} 页` : "",
          citation.doc_type
        ].filter(Boolean).join(" · ");
        const quote = document.createElement("div");
        quote.className = "source-quote";
        quote.textContent = citation.quote || "";
        card.append(title, meta, quote);
        const url = citation.source_url || (/^https?:\/\//.test(citation.source_path || "") ? citation.source_path : "");
        if (url) {
          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "查看原始来源 ↗";
          card.appendChild(link);
        }
        sourceList.appendChild(card);
      });
      drawer.classList.add("open");
      backdrop.classList.add("open");
    }

    function closeSources() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
    }

    async function feedback(requestId, helpful, button) {
      if (!requestId) return;
      try {
        await apiFetch("/v1/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ request_id: requestId, helpful })
        });
        button.textContent = helpful ? "✓ 已反馈" : "✓ 已记录";
        button.classList.add("feedback-ok");
      } catch (_) {}
    }

    async function ask(question, image) {
      if (busy || (!question.trim() && !image)) return;
      busy = true;
      send.disabled = true;
      const user = addMessage("user", question.trim() || "请分析这张图片");
      if (image) {
        const node = document.createElement("img");
        node.src = image.dataUrl;
        user.bubble.appendChild(node);
      }
      const bot = addMessage("bot", "正在思考…", { noStore: true });
      let answer = "";
      let events = {};
      try {
        const response = await apiFetch("/v1/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: question.trim() || "请分析这张图片",
            session_id: sessionId,
            profile: profilePayload(),
            domain: domain.value,
            image_base64: image ? image.base64 : null,
            image_mime: image ? image.mime : null
          })
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            const line = part.split("\n").find((item) => item.startsWith("data: "));
            if (!line) continue;
            const event = JSON.parse(line.slice(6));
            if (event.type === "delta") {
              answer += event.content;
              renderAnswer(bot.bubble, answer);
            } else if (event.type === "replace") {
              answer = event.content;
              renderAnswer(bot.bubble, answer);
            } else if (event.type === "done") {
              events = event;
              if (!answer) {
                answer = event.answer || "";
                renderAnswer(bot.bubble, answer);
              }
            }
          }
        }
        currentMessages.push({
          role: "assistant",
          text: answer,
          citations: events.citations || [],
          strategy: events.strategy || "",
          requestId: events.request_id || ""
        });
        renderActions(bot.message, events);
        saveCurrent();
      } catch (error) {
        renderAnswer(bot.bubble, "请求失败：" + error.message);
      } finally {
        busy = false;
        send.disabled = false;
        input.focus();
      }
    }

    async function askDocument(question, file) {
      if (busy || !file) return;
      busy = true;
      send.disabled = true;
      const prompt = question.trim() || "请审查这份文件，找出潜在漏洞和风险，并判断合同是否具备进一步审阅或签约的条件。";
      addMessage("user", `${prompt}\n\n文件：${file.name}`);
      const bot = addMessage("bot", "正在读取并审查文件…", { noStore: true });
      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("question", prompt);
        formData.append("session_id", sessionId);
        formData.append("profile_json", JSON.stringify(profilePayload()));
        const response = await apiFetch("/v1/chat/file", { method: "POST", body: formData });
        if (!response.ok) {
          let detail = "HTTP " + response.status;
          try { detail = (await response.json()).detail || detail; } catch (_) {}
          throw new Error(detail);
        }
        const payload = await response.json();
        renderAnswer(bot.bubble, payload.answer || "文件审查完成。");
        renderActions(bot.message, payload);
        currentMessages.push({
          role: "assistant",
          text: payload.answer || "",
          citations: payload.citations || [],
          strategy: payload.strategy || "",
          requestId: payload.request_id || ""
        });
        saveCurrent();
      } catch (error) {
        renderAnswer(bot.bubble, "文件审查失败：" + error.message);
      } finally {
        busy = false;
        send.disabled = false;
        input.focus();
      }
    }

    bindExamples(document);
    accountBtn.addEventListener("click", () => showAuth("login"));
    logoutBtn.addEventListener("click", () => clearAuth(true));
    authTabLogin.addEventListener("click", () => setAuthMode("login"));
    authTabRegister.addEventListener("click", () => setAuthMode("register"));
    authSkip.addEventListener("click", hideAuth);
    authForm.addEventListener("submit", submitAuth);
    risk.addEventListener("change", async () => {
      if (!currentUser) return;
      try {
        const response = await apiFetch("/v1/auth/profile", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ risk_level: risk.value })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(detailText(payload));
        currentUser = payload.user;
        applyAccountUI();
      } catch (error) {
        alert("风险等级保存失败：" + error.message);
      }
    });
    newChat.addEventListener("click", startNewSession);
    clearChat.addEventListener("click", async () => {
      if (busy) return;
      const current = currentSession();
      const sessionToClear = sessionId;
      const wasPersisted = current && hasRounds(current);
      if (wasPersisted) {
        sessions = sessions.filter((item) => item.id !== current.id);
        persistSessions();
        try {
          await apiFetch("/v1/sessions/" + encodeURIComponent(sessionToClear), {
            method: "DELETE"
          });
        } catch (_) {}
      }
      draft = { id: newId(), title: "新会话", updatedAt: Date.now(), messages: [] };
      sessionId = draft.id;
      currentMessages = [];
      sessionLabel.textContent = sessionId;
      resetChat();
      renderHistory();
      input.focus();
    });
    drawerClose.addEventListener("click", closeSources);
    backdrop.addEventListener("click", closeSources);
    attach.addEventListener("click", () => imageInput.click());
    documentAttach.addEventListener("click", () => documentInput.click());
    imageRemove.addEventListener("click", clearImage);
    documentRemove.addEventListener("click", clearDocument);
    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { alert("图片不能超过 8 MB"); clearImage(); return; }
      const reader = new FileReader();
      reader.onload = () => {
        clearDocument();
        const dataUrl = String(reader.result || "");
        selectedImage = { name: file.name, mime: file.type || "image/png", dataUrl, base64: dataUrl.split(",", 2)[1] || "" };
        imagePreviewImg.src = dataUrl;
        imagePreviewName.textContent = file.name;
        imagePreview.hidden = false;
      };
      reader.readAsDataURL(file);
    });
    documentInput.addEventListener("change", () => {
      const file = documentInput.files && documentInput.files[0];
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) { alert("文件不能超过 20 MB"); clearDocument(); return; }
      clearImage();
      selectedDocument = file;
      documentPreviewName.textContent = file.name;
      documentPreview.hidden = false;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (busy) return;
      const question = input.value;
      const documentFile = selectedDocument;
      const image = selectedImage;
      const key = [question.trim(), documentFile ? documentFile.name : "", image ? image.base64.slice(0, 64) : ""].join("|");
      const now = Date.now();
      if (key === lastSubmit.key && now - lastSubmit.at < 1200) return;
      lastSubmit = { key, at: now };
      input.value = "";
      clearDocument();
      clearImage();
      if (documentFile) askDocument(question, documentFile);
      else ask(question, image);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        if (!busy) form.requestSubmit();
      }
    });

    // 初始化：恢复登录态，再载入当前账号的最近会话
    bootstrapAuth();
  </script>
</body>
</html>
